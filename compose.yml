services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: company_detection
      POSTGRES_USER: company_detection
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_company_detection}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company_detection -d company_detection"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - company_detector_db:/var/lib/postgresql/data

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-local_company_detection}
    volumes:
      - ./docs/technical:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        psql -h postgres -U company_detection -d company_detection -f /migrations/migration_v1.sql &&
        psql -h postgres -U company_detection -d company_detection -f /migrations/migration_v2_webhook_slack_queue.sql &&
        psql -h postgres -U company_detection -d company_detection -f /migrations/migration_v3_report_provenance.sql &&
        psql -h postgres -U company_detection -d company_detection -f /migrations/migration_v4_llm_usage_provenance.sql &&
        psql -h postgres -U company_detection -d company_detection -f /migrations/migration_v5_feedback_monitor.sql
    restart: "no"

  dashboard:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://company_detection:${POSTGRES_PASSWORD:-local_company_detection}@postgres:5432/company_detection
      DASHBOARD_PORT: 3001
    command: ["node", "dashboard/app.js"]
    ports:
      - "${DASHBOARD_BIND_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/sales-sheet"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - company_detector_exports:/app/dashboard/public/exports

  webhook:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://company_detection:${POSTGRES_PASSWORD:-local_company_detection}@postgres:5432/company_detection
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL:-http://localhost:3001}
      WEBHOOK_PORT: 3002
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-webhook-secret}
    command: ["node", "webhook/app.js"]
    ports:
      - "${WEBHOOK_BIND_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://company_detection:${POSTGRES_PASSWORD:-local_company_detection}@postgres:5432/company_detection
      OPENCLAW_WORKSPACE: /app/openclaw_workspace
      OPENCLAW_STATE_DIR: /root/.openclaw
      OPENCLAW_CONFIG_PATH: /root/.openclaw/openclaw.json
      OPENCLAW_CONFIGURE: ${OPENCLAW_CONFIGURE:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-sumopod}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://ai.sumopod.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-sumopod/kimi-k2.6}
      LLM_MODEL_ID: ${LLM_MODEL_ID:-kimi-k2.6}
      LLM_ADDITIONAL_MODELS: ${LLM_ADDITIONAL_MODELS:-komerce}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      REGISTER_WORKER_MODE: ${REGISTER_WORKER_MODE:-agent}
      REGISTER_WORKER_DELIVER_TELEGRAM: ${REGISTER_WORKER_DELIVER_TELEGRAM:-true}
      REGISTER_WORKER_AGENT_TIMEOUT_SEC: ${REGISTER_WORKER_AGENT_TIMEOUT_SEC:-900}
      REGISTER_WORKER_MAX_ATTEMPTS: ${REGISTER_WORKER_MAX_ATTEMPTS:-3}
      REGISTER_WORKER_IDLE_MS: ${REGISTER_WORKER_IDLE_MS:-10000}
      REGISTER_WORKER_RUN_TIMEOUT_MS: ${REGISTER_WORKER_RUN_TIMEOUT_MS:-120000}
      OPENCLAW_BIN: ${OPENCLAW_BIN:-/usr/local/bin/openclaw}
      TELEGRAM_ALLOW_FROM: ${TELEGRAM_ALLOW_FROM:-}
      TELEGRAM_ASSISTANT_ALLOW_FROM: ${TELEGRAM_ASSISTANT_ALLOW_FROM:-}
      TELEGRAM_DEFAULT_BOT_TOKEN: ${TELEGRAM_DEFAULT_BOT_TOKEN:-}
      TELEGRAM_ASSISTANT_BOT_TOKEN: ${TELEGRAM_ASSISTANT_BOT_TOKEN:-}
      REGISTER_WORKER_TELEGRAM_TO: ${REGISTER_WORKER_TELEGRAM_TO:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      GOOGLE_CSE_KEY: ${GOOGLE_CSE_KEY:-}
      GOOGLE_CSE_ID: ${GOOGLE_CSE_ID:-}
    entrypoint: ["/app/ops/docker/worker-entrypoint.sh"]
    command: ["node", "webhook/worker.js"]
    volumes:
      - company_detector_reports:/app/openclaw_workspace/reports
      - company_detector_openclaw:/root/.openclaw

  gateway:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://company_detection:${POSTGRES_PASSWORD:-local_company_detection}@postgres:5432/company_detection
      OPENCLAW_WORKSPACE: /app/openclaw_workspace
      OPENCLAW_STATE_DIR: /root/.openclaw
      OPENCLAW_CONFIG_PATH: /root/.openclaw/openclaw.json
      OPENCLAW_CONFIGURE: ${OPENCLAW_CONFIGURE:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-sumopod}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://ai.sumopod.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-sumopod/kimi-k2.6}
      LLM_MODEL_ID: ${LLM_MODEL_ID:-kimi-k2.6}
      LLM_ADDITIONAL_MODELS: ${LLM_ADDITIONAL_MODELS:-komerce}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      TELEGRAM_ALLOW_FROM: ${TELEGRAM_ALLOW_FROM:-}
      TELEGRAM_ASSISTANT_ALLOW_FROM: ${TELEGRAM_ASSISTANT_ALLOW_FROM:-}
      TELEGRAM_DEFAULT_BOT_TOKEN: ${TELEGRAM_DEFAULT_BOT_TOKEN:-}
      TELEGRAM_ASSISTANT_BOT_TOKEN: ${TELEGRAM_ASSISTANT_BOT_TOKEN:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      GOOGLE_CSE_KEY: ${GOOGLE_CSE_KEY:-}
      GOOGLE_CSE_ID: ${GOOGLE_CSE_ID:-}
    entrypoint: ["/app/ops/docker/worker-entrypoint.sh"]
    command: ["openclaw", "gateway", "run", "--bind", "loopback", "--compact"]
    healthcheck:
      test: ["CMD", "openclaw", "gateway", "health"]
      interval: 30s
      timeout: 15s
      retries: 5
    volumes:
      - company_detector_reports:/app/openclaw_workspace/reports
      - company_detector_openclaw:/root/.openclaw

  digest:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://company_detection:${POSTGRES_PASSWORD:-local_company_detection}@postgres:5432/company_detection
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL:-http://localhost:3001}
      DASHBOARD_PUBLIC_BASE_URL: ${DASHBOARD_PUBLIC_BASE_URL:-http://localhost:3001}
      SALES_SHEET_WEB_URL: ${SALES_SHEET_WEB_URL:-http://localhost:3001/sales-sheet}
      SALES_SHEET_LATEST_URL: ${SALES_SHEET_LATEST_URL:-http://localhost:3001/sales-sheet/latest.xlsx}
      SALES_SHEET_EXPORT_DIR: /app/dashboard/public/exports
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_REPORT_CHANNEL: ${SLACK_REPORT_CHANNEL:-}
      SLACK_DIGEST_MIN_CONFIDENCE: ${SLACK_DIGEST_MIN_CONFIDENCE:-60}
      SLACK_DIGEST_HOUR_WIB: ${SLACK_DIGEST_HOUR_WIB:-9}
      SLACK_DIGEST_MINUTE_WIB: ${SLACK_DIGEST_MINUTE_WIB:-0}
    command: ["node", "ops/docker/digest-scheduler.js"]
    volumes:
      - company_detector_exports:/app/dashboard/public/exports

  review-monitor:
    profiles: ["review-monitor"]
    build: .
    restart: unless-stopped
    env_file:
      - path: .env.review-monitor
        required: false
    environment:
      REVIEW_MONITOR_STATE_DIR: /app/review_monitor/state
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
    command: ["node", "ops/docker/review-monitor-scheduler.js"]
    volumes:
      - company_detector_review_monitor:/app/review_monitor/state

  feedback-monitor-ingress:
    profiles: ["feedback-monitor"]
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env.feedback-monitor
        required: false
    environment:
      DATABASE_URL: postgresql://company_detection:${POSTGRES_PASSWORD:-local_company_detection}@postgres:5432/company_detection
      FEEDBACK_MONITOR_PORT: 3003
    command: ["node", "feedback_monitor/app.js"]
    ports:
      - "${FEEDBACK_MONITOR_BIND_PORT:-3003}:3003"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  feedback-monitor-worker:
    profiles: ["feedback-monitor"]
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env.feedback-monitor
        required: false
    environment:
      DATABASE_URL: postgresql://company_detection:${POSTGRES_PASSWORD:-local_company_detection}@postgres:5432/company_detection
      LLM_BASE_URL: ${LLM_BASE_URL:-https://ai.sumopod.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      TELEGRAM_DEFAULT_BOT_TOKEN: ${TELEGRAM_DEFAULT_BOT_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
    command: ["node", "feedback_monitor/worker.js"]

volumes:
  company_detector_db:
  company_detector_exports:
  company_detector_reports:
  company_detector_openclaw:
  company_detector_review_monitor:
