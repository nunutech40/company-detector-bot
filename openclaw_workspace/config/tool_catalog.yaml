tools:

  # ── Tier 1: Deterministic Go Tools (always available, free) ──────────────────

  company_check:
    status: enabled
    type: go_cli
    command: "scripts/company_check_go.sh --email <email> [--full-name <name>] [--brand-name <brand>] --save --send-slack"
    cost: free
    priority: mvp
    note: "Full deterministic pipeline: emailintel → domain_checker → crawler → search cascade → scraper → scoring → report. Always run this first."

  email_intelligence:
    status: enabled
    type: go_package
    cost: free
    priority: mvp
    note: "Included in company_check. Parse email, detect free/custom/disposable/role mailbox."

  domain_checker:
    status: enabled
    type: go_package
    cost: free
    priority: mvp
    note: "Included in company_check. DNS MX/A lookup + HTTP website probe."

  website_crawler:
    status: enabled
    type: go_package
    cost: free
    priority: mvp
    note: "Included in company_check. Crawl /about /team /contact /founders for business signals."

  free_scraper:
    status: enabled
    type: go_package
    cost: free
    priority: mvp
    note: "Included in company_check. HTTP fetch + strip HTML → plain text. Low reliability."

  scoring_engine:
    status: enabled
    type: go_package
    cost: free
    priority: mvp
    note: "Included in company_check. Deterministic rules-first scoring. Always the final scorer."

  serp_query_builder:
    status: enabled
    type: go_package
    cost: free
    priority: mvp
    note: "Included in company_check. Build query variants from email/name/brand."

  tool_status:
    status: enabled
    type: go_cli
    command: "scripts/tool_status_go.sh"
    cost: free
    priority: mvp

  last_report:
    status: enabled
    type: go_cli
    command: "scripts/last_report_go.sh [email]"
    cost: free
    priority: mvp

  input_normalizer:
    status: enabled
    type: go_package
    command: "scripts/company_check_go.sh --input-json '<json>' --json"
    cost: free
    priority: mvp

  brandhint:
    status: enabled
    type: go_package
    cost: free
    priority: mvp
    note: "Deteksi apakah local part email adalah brand/toko atau nama orang. Output: IsBrandHint, Confidence, Signals, Suggestion. Dipanggil internal oleh company_check pipeline."

  sociallinks:
    status: enabled
    type: go_package
    cost: free
    priority: mvp
    note: "Extract social media links dari HTML/text content. Mendukung Instagram, LinkedIn, Facebook, Twitter/X, TikTok, YouTube, Tokopedia, Shopee, Bukalapak, Lazada, WhatsApp. Deduplicate otomatis."

  rolesignal:
    status: enabled
    type: go_package
    cost: free
    priority: mvp
    note: "Deteksi sinyal role bisnis (founder, owner, CEO, direktur, employee, freelancer) dari teks snippet. Mendukung pola bahasa Indonesia dan Inggris. Output: Signals, StrongestRole, HasOwnerSignal."

  batch_csv_check:
    status: legacy_reference
    type: legacy_js_script
    command: "node scripts/batch_csv_check.js <csv_file> [--limit N] [--save]"
    cost: free
    priority: legacy

  # ── Tier 2: Search Cascade (multi-provider, automatic fallback) ───────────────

  web_search_cascade:
    status: enabled
    type: go_package
    command: "scripts/web_search_go.sh --query <query> --limit 5"
    cost: free
    priority: mvp
    note: "Included in company_check. Tries providers in order: google_cse → brave → bing_html → ddg_html. Returns first success."

  web_search_google_cse:
    status: disabled_not_configured
    type: go_package
    cost: free
    priority: phase_a
    note: "100 queries/hari gratis. Paling reliable."
    setup: "Set GOOGLE_CSE_KEY dan GOOGLE_CSE_ID di /home/nunuopc/.openclaw/gateway.systemd.env"
    setup_url: "https://programmablesearchengine.google.com/"

  web_search_brave:
    status: enabled
    type: go_package
    cost: paid_low
    priority: phase_a
    note: "~$5 credit/bulan otomatis. Reliable, tidak diblokir ISP. Key: BRAVE_SEARCH_API_KEY di gateway.systemd.env"
    setup_url: "https://api.search.brave.com/"

  web_search_bing_html:
    status: enabled
    type: go_package
    cost: free
    priority: phase_a
    note: "HTML scraping Bing. Gratis, lebih toleran dari DDG. Fallback otomatis."

  web_search_ddg_html:
    status: enabled
    type: go_package
    cost: free
    priority: mvp
    note: "HTML scraping DDG. Gratis, paling fragile — sering diblokir ISP Indonesia."

  # ── Tier 3: OpenClaw Built-in Tools (AI can call directly) ───────────────────

  web_fetch:
    status: enabled
    type: openclaw_builtin
    cost: free
    priority: phase_a
    note: "AI bisa panggil langsung. Fetch URL + extract readable content. Gunakan untuk /about, /team, social profiles, marketplace pages, LinkedIn snippets."

  openclaw_web_search:
    status: disabled_runtime
    type: openclaw_builtin
    cost: free_or_low
    priority: phase_a
    note: "Jangan dipanggil di VPS: SearXNG tidak dikonfigurasi dan fallback DDG timeout. Gunakan web_search_go."

  browser:
    status: disabled_runtime
    type: openclaw_builtin
    cost: high_runtime
    priority: phase_a
    note: "Tidak ada browser binary di VPS. Jangan dipanggil; laporkan URL JS-heavy sebagai keterbatasan evidence."

  # ── Tier 4: Paid/Not Configured (note in report, don't block) ────────────────

  firecrawl_scrape:
    status: disabled_waiting_budget
    type: provider_plugin
    cost: paid
    price: "$16/month"
    priority: phase_b
    note: "Deep scrape, JS-heavy pages, structured extraction. Jauh lebih baik dari free_scraper."

  tavily_search:
    status: disabled_waiting_budget
    type: provider_plugin
    cost: paid
    price: "$20/month"
    priority: phase_b
    note: "AI-friendly search dengan snippet terstruktur. Lebih baik dari DDG/Bing HTML."

  enrichment_api:
    status: disabled_waiting_budget
    type: paid_vendor
    cost: paid
    price: "$99+/month"
    priority: phase_d
    note: "PDL/Apollo/Clearbit — direct company/role lookup dari email. Paling powerful untuk free email."

  # ── Delivery ──────────────────────────────────────────────────────────────────

  telegram_message:
    status: enabled
    type: channel
    cost: free
    priority: mvp

  slack_reporter:
    status: enabled
    type: go_cli
    command: "scripts/company_check_go.sh --email <email> --save --send-slack"
    cost: free
    priority: mvp
    note: "Sends to Slack for all classifications. After DB: personal → DB only, company → Telegram + Slack."

  # ── OpenClaw Plugins (installable) ───────────────────────────────────────────

  plugin_webhooks:
    status: disabled_not_configured
    type: openclaw_plugin
    package: "@openclaw/webhooks"
    install: "included in OpenClaw — enable via openclaw.json"
    cost: free
    priority: phase_c
    note: "Authenticated inbound webhooks → bind platform register event ke OpenClaw TaskFlow. Dipakai saat integrasi platform register (Phase C). Tidak perlu install, sudah included."

  plugin_tavily:
    status: disabled_waiting_budget
    type: openclaw_plugin
    package: "@openclaw/tavily-plugin"
    install: "openclaw plugins install clawhub:tavily"
    cost: paid
    price: "$20/month"
    priority: phase_b
    note: "AI-friendly search + extract. Lebih baik dari DDG/Bing HTML. Butuh TAVILY_API_KEY."

  plugin_firecrawl:
    status: disabled_waiting_budget
    type: openclaw_plugin
    package: "@openclaw/firecrawl-plugin"
    install: "openclaw plugins install clawhub:firecrawl"
    cost: paid
    price: "$16/month"
    priority: phase_b
    note: "Deep scrape + JS-heavy pages + structured extraction. Jauh lebih baik dari free_scraper. Butuh FIRECRAWL_API_KEY."

  plugin_searxng:
    status: disabled_not_configured
    type: openclaw_plugin
    package: "@openclaw/searxng-plugin"
    install: "openclaw plugins install clawhub:searxng"
    cost: free
    priority: phase_b
    note: "Self-hosted search engine. Gratis, tidak perlu API key. Alternatif Brave kalau mau zero cost. Butuh instance SearXNG sendiri di VPS."

  plugin_diagnostics_prometheus:
    status: disabled_not_configured
    type: openclaw_plugin
    package: "@openclaw/diagnostics-prometheus"
    install: "openclaw plugins install npm:@openclaw/diagnostics-prometheus"
    cost: free
    priority: phase_c
    note: "Export metrics OpenClaw ke Prometheus: job count, token usage, latency. Berguna untuk monitoring dashboard."
